<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{color-scheme:dark;--bg:#111110;--surface:#1a1a19;--raised:#242422;--text:#f0efec;--muted:#c3c2b7;--faint:#8f8e85;--grid:#2c2c2a;--axis:#383835;--line:rgba(255,255,255,.1);--good:#0ca30c;--bad:#d03b3b;--accent:#3987e5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1440px;margin:auto;padding:10px 12px 40px}
header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
h1{font-size:1.05rem;margin:0}
#status{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}#status.ok{color:#4cc94c}#status.bad{color:#ff8a80}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
button,select,input{font:inherit;color:var(--text)}
button{min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--raised);font-weight:600;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#04152a}
button.on{outline:2px solid var(--accent)}
button:disabled{opacity:.4;cursor:default}
select,input{min-height:42px;padding:0 8px;background:var(--bg);border:1px solid var(--axis);border-radius:8px;max-width:100%}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:6px 0 10px;scrollbar-width:none}
.tabs button{flex:none;background:none;border-color:transparent;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--raised);border-color:var(--line);color:var(--text)}
#grid{display:grid;gap:8px;grid-auto-rows:56px;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.w{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.w.good{border-color:var(--good)}.w.bad{border-color:var(--bad);background:#2a1716}
.w.off .body{opacity:.45}
.edit .w{touch-action:pan-y;cursor:grab;outline:1px dashed var(--faint);user-select:none}
.edit .w.drag{outline:2px solid var(--accent);z-index:5;cursor:grabbing}
.wh{display:flex;gap:6px;align-items:center;justify-content:space-between;min-height:18px}
.wt{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font-size:.62rem;color:var(--faint);border:1px solid var(--axis);border-radius:4px;padding:0 4px}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.big{font-size:clamp(1.5rem,5.5vw,2.3rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.unit{font-size:.75rem;color:var(--muted);font-weight:400;margin-left:3px}
.pill{font-size:.72rem;font-weight:600;color:var(--muted);white-space:nowrap}
.pill.good{color:#4cc94c}.pill.bad{color:#ff8a80}
.sub{font-size:.7rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
canvas{display:block;flex:1;min-height:0;width:100%}
.readout{font-size:.7rem;color:var(--muted);min-height:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.72rem;color:var(--muted)}
.key{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.gear{font-size:clamp(2.6rem,10vw,4.4rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:.82rem;border-bottom:1px solid var(--grid)}
.row span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.scroll{overflow:auto;flex:1;min-height:0}
.edit .scroll{overflow:hidden}
.cyl{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;flex:1;min-height:0}
.cyl div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.7rem;min-height:0;color:var(--muted)}
.cyl i{display:block;width:70%;background:var(--faint);border-radius:3px 3px 0 0;min-height:2px}
.cyl i.good{background:var(--good)}.cyl i.bad{background:var(--bad)}
.gear-handle,.gear-cog,.move-handle{display:none;position:absolute;border:0;background:var(--accent);color:#04152a;min-height:0;padding:0;border-radius:8px}
.edit .gear-cog{display:block;top:4px;right:4px;width:38px;height:38px;z-index:3}
.edit .move-handle{display:block;top:4px;left:4px;width:38px;height:38px;z-index:3;touch-action:none;cursor:grab}
.edit .gear-handle{display:block;right:0;bottom:0;width:38px;height:38px;border-radius:8px 0 8px 0;touch-action:none;cursor:nwse-resize;z-index:3}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--axis);border-radius:12px;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px);padding:14px}
dialog.wide{width:min(960px,calc(100vw - 16px))}
.verdict{border-radius:10px;padding:12px 14px;margin:8px 0;border:1px solid var(--line);background:var(--raised)}.verdict.attention{border-color:var(--bad);background:#2a1716}.verdict.good{border-color:var(--good)}.verdict.watch{border-color:#fab219}.verdict b{font-size:1.02rem;display:block;margin-bottom:3px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:8px 0}.stats div{background:var(--raised);border-radius:8px;padding:7px 9px;font-size:.72rem;color:var(--muted)}.stats b{display:block;font-size:1.05rem;color:var(--text);font-variant-numeric:tabular-nums}
details.f{border:1px solid var(--line);border-radius:8px;margin:5px 0;padding:8px 10px;background:var(--surface)}details.f summary{cursor:pointer;font-size:.88rem;font-weight:600}details.f p{margin:6px 0 0}details.f small{color:var(--faint);display:block;margin-top:6px}.lv{font-weight:700;margin-right:6px}.lv.attention{color:#ff8a80}.lv.watch{color:#fab219}.lv.good{color:#4cc94c}.lv.info{color:var(--muted)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:1rem;margin:0 0 8px}dialog h3{font-size:.86rem;margin:14px 0 4px;color:var(--muted)}
dialog p{margin:0 0 8px;font-size:.86rem}dialog a{color:#7fb5f2}
label{display:block;font-size:.8rem;color:var(--muted);margin:8px 0 2px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
table{width:100%;border-collapse:collapse;font-size:.8rem}th,td{padding:4px 6px;border-bottom:1px solid var(--grid);text-align:left}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.check{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--text);margin:3px 0}.check input{min-height:20px;width:20px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--axis);border-radius:8px;padding:8px 12px;font-size:.85rem;max-width:calc(100vw - 32px);z-index:50}
footer{margin-top:14px;font-size:.72rem;color:var(--faint)}footer p{margin:2px 0}
</style>
</head>

</main>

<div id="toast" hidden></div>
<script>
"use strict";
const BUILD_ID = "OBD-20261104-1648Z", BUILD_UTC = "2026-11-04T16:48:11Z";
const SPP_UUID = "00001101-0000-1000-8000-00805f9b34fb";

/*PURE-START*/
const c2f = c => c * 9 / 5 + 32;
const u16 = (a, b) => a * 256 + b;
const s16 = (a, b) => { const v = a * 256 + b; return v >= 32768 ? v - 65536 : v; };

// Only these commands can reach the vehicle. Clear-codes (04), writes (2E),
// routines (31), security access (27) and session control (10) match nothing here.
function isAllowedCommand(cmd) {
  const c = String(cmd).toUpperCase().replace(/\s+/g, "");
  return /^AT(Z|E0|L0|S0|H0|AT1|SP[06]|DPN|RV|I)$/.test(c)
    || /^ATSH[0-9A-F]{3}$/.test(c)
    || /^01[0-9A-F]{2}$/.test(c)
    || /^02[0-9A-F]{2}00$/.test(c)
    || /^0[37A]$/.test(c)
    || /^06[0-9A-F]{2}$/.test(c)
    || /^09[0-9A-F]{2}$/.test(c)
    || /^22[0-9A-F]{4}$/.test(c);
}
function cleanLines(raw) {
  return String(raw).toUpperCase().split(/[\r\n]+/).map(l => l.replace(/[\s>]/g, "")).filter(Boolean).filter(l => !/^SEARCHING/.test(l));
}
function isNoData(raw) {
  return /NODATA|UNABLETOCONNECT|\?|ERROR|STOPPED|BUSINIT|BUFFERFULL/.test(String(raw).toUpperCase().replace(/[\s.]/g, ""));
}
function toMessages(raw) {
  const msgs = []; let cur = null;
  for (const l of cleanLines(raw)) {
    const m = l.match(/^([0-9A-F]):([0-9A-F]+)$/);
    if (m) {
      if (m[1] === "0") { cur = m[2]; msgs.push(cur); }
      else if (cur !== null) { cur += m[2]; msgs[msgs.length - 1] = cur; }
    } else if (/^[0-9A-F]{3}$/.test(l)) cur = null;
    else if (/^[0-9A-F]+$/.test(l)) { msgs.push(l); cur = null; }
  }
  return msgs;
}
function hexBytes(hex) { const o = []; for (let p = 0; p + 1 < hex.length; p += 2) o.push(parseInt(hex.slice(p, p + 2), 16)); return o; }
function dataBytes(raw, prefix) {
  for (const m of toMessages(raw)) if (m.startsWith(prefix)) return hexBytes(m.slice(prefix.length));
  return null;
}
// Support bitmasks: every ECU that answers contributes; bit 7 of the first byte = base+1.
function parseSupport(raw, base, service = "41") {
  const out = new Set(), pre = service + base.toString(16).toUpperCase().padStart(2, "0");
  for (const m of toMessages(raw)) {
    if (!m.startsWith(pre)) continue;
    hexBytes(m.slice(4, 12)).forEach((b, i) => { for (let k = 0; k < 8; k++) if (b & (0x80 >> k)) out.add(base + i * 8 + k + 1); });
  }
  return out;
}
function decodeDtcBytes(a, b) {
  return "PCBU"[a >> 6] + ((a >> 4) & 3) + (a & 15).toString(16).toUpperCase() + (b >> 4).toString(16).toUpperCase() + (b & 15).toString(16).toUpperCase();
}
function parseDtc(raw, resp) {
  const codes = new Set();
  for (const m of toMessages(raw)) {
    if (!m.startsWith(resp)) continue;
    const n = parseInt(m.slice(2, 4), 16), hex = m.slice(4);
    for (let i = 0; i < n && i * 4 + 4 <= hex.length; i++) {
      const a = parseInt(hex.substr(i * 4, 2), 16), b = parseInt(hex.substr(i * 4 + 2, 2), 16);
      if (a || b) codes.add(decodeDtcBytes(a, b));
    }
  }
  return [...codes];
}
function parseMode06(raw, mid) {
  const bytes = dataBytes(raw, "46" + mid), out = {};
  if (!bytes) return out;
  let i = 0;
  while (i + 8 <= bytes.length) {
    out[bytes[i]] = u16(bytes[i + 2], bytes[i + 3]);
    i += 8;
    if (bytes[i] === parseInt(mid, 16)) i += 1;
  }
  return out;
}
// PID 01 layout per J1979, spark-ignition mapping. null availability = not fitted.
function parseMonitor(b) {
  const row = (name, avail, incomplete) => ({ name, state: !avail ? "na" : incomplete ? "incomplete" : "complete" });
  const spark = ["Catalyst","Heated catalyst","Evaporative system","Secondary air","A/C refrigerant","Oxygen sensor","O2 sensor heater","EGR/VVT"];
  const out = { mil: !!(b[0] & 0x80), dtcCount: b[0] & 0x7f, monitors: [
    row("Misfire", b[1] & 1, b[1] & 16), row("Fuel system", b[1] & 2, b[1] & 32), row("Components", b[1] & 4, b[1] & 64)] };
  spark.forEach((name, i) => out.monitors.push(row(name, b[2] & (1 << i), b[3] & (1 << i))));
  return out;
}
function asciiFrom(raw, prefix) {
  const b = dataBytes(raw, prefix);
  return b ? b.filter(x => x >= 32 && x < 127).map(x => String.fromCharCode(x)).join("").trim() : null;

  kids.push(add, el("button", { textContent: "Add vehicle", onclick: () => { const name = add.value.trim().slice(0, 60); if (!name) return; const id = "v" + Date.now().toString(36); vehicles[id] = { id, name, engine: null, layout: null, afm: false, trans: "", notes: "" }; saveVehicles(); loadVehicle(id); resetLive(); renderVehicleSelect(); renderTabs(); renderGrid(); loadDrives(); openVehicle(); } }));
  $("dlg").classList.remove("wide"); showDlg("Vehicle settings", ...kids);
}

/* ---------- Wiring ---------- */
$("connect").onclick = async () => {
  try { const port = await navigator.serial.requestPort({ filters: [{ bluetoothServiceClassId: SPP_UUID }], allowedBluetoothServiceClassIds: [SPP_UUID] }); await start(new SerialLink(port), "OBDLink LX"); }
  catch (e) { if (e.name !== "NotFoundError") setStatus(e.message, "bad"); }
};
$("sim").onclick = () => start(new SimLink(), "simulator (not vehicle data)");
$("stop").onclick = () => stop(false);
$("editBtn").onclick = () => setEdit(!editMode);
$("addBtn").onclick = openAdd;
$("resetBtn").onclick = () => { dash[tab] = buildDash(tab); commit(); };
$("moreBtn").onclick = () => { $("dlg").classList.remove("wide"); openMore(); };
$("reviewBtn").onclick = openReview;
$("vehBtn").onclick = openVehicle;
$("vehicle").onchange = async e => { loadVehicle(e.target.value); resetLive(); renderTabs(); renderGrid(); await loadDrives(); };
let lastCols = cols();
addEventListener("resize", () => { if (cols() !== lastCols) { lastCols = cols(); renderGrid(); } });
document.addEventListener("visibilitychange", async () => { if (session && document.visibilityState === "visible") { try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} } });
setInterval(() => { painters.forEach(p => { try { p(); } catch (e) { console.error(e); } }); }, 250);
$("stamp").textContent = "Build " + BUILD_ID + " · " + BUILD_UTC;
if (!("serial" in navigator)) { $("unsupported").hidden = false; $("connect").disabled = true; }
loadVehicle(vid); resetLive(); renderVehicleSelect(); renderTabs(); renderGrid(); loadDrives();
</script>
</body>
</html>
